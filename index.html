import sys
import asyncio
import platform
from pathlib import Path

async def custom_site():
    import embed
    import tarfile
    window = platform.window
    appdir = Path('/data/data/snake-fever')
    appdir.mkdir(exist_ok=True)
    window.infobox.innerText = 'LOADING SNAKE FEVER'
    async with platform.fopen('a666016f4bb8-snake-fever.tar.gz', 'rb') as archive:
        with tarfile.open(fileobj=archive, mode='r:gz') as tar:
            tar.extractall(path=appdir.as_posix(), filter='tar')
    platform.run_main(PyConfig, loaderhome=appdir / 'assets', loadermain=None)
    while embed.counter() < 0:
        await asyncio.sleep(.1)
    main = appdir / 'assets' / 'main.py'
    __import__(__name__).__file__ = main
    if not window.MM.UME:
        window.infobox.innerText = 'CLICK TO START'
        while not window.MM.UME:
            await asyncio.sleep(.1)
    await TopLevel_async_handler.start_toplevel(platform.shell, console=False)
    def ui_callback(pkg):
        window.infobox.innerText = 'LOADING SNAKE FEVER'
    await shell.source(main, callback=ui_callback)
    window.infobox.style.display = 'none'
    window.transfer.hidden = True
    window.canvas.style.visibility = 'visible'
    window.window_resize()

asyncio.run(custom_site())
